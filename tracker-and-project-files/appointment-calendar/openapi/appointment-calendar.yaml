                $ref: '#/components/schemas/MembershipPage'
        '400':
          description: Bad request/validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found or concealed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dependency unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Default 20; maximum 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 4096
        description: Opaque tamper-evident keyset cursor
      description: 'Authorization: authenticated user; returns only memberships for principal.'
      x-tenant-security: Identity-derived authorization

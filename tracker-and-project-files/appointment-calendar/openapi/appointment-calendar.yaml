openapi: 3.1.2
info:
  title: Appointment Calendar API
  version: 1.0.0-design
  description: Phase 5 design contract. Tenant scope is path-based but always authorized from authenticated membership. PostgreSQL
    exclusion constraints are final booking arbiter. Appointment state-changing commands require an Idempotency-Key and a
    strong If-Match ETag; GET is never authoritative booking ownership. This is a design-first contract and not proof that
    server endpoints are implemented.
servers:
- url: https://api.example.com
  description: Illustrative production host; replace for each environment
security:
- bearerAuth: []
paths:
  /api/v1/me:
    get:
      tags:
      - Identity
      operationId: getCurrentUser
      summary: Get current user
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: Bad request/validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found or concealed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dependency unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: 'Authorization: authenticated user.'
      x-tenant-security: Identity-derived authorization
  /api/v1/me/memberships:
    get:
      tags:
      - Identity
      operationId: listMyMemberships
      summary: List my memberships
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:

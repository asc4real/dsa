name: Release artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B clean verify
      - run: docker build -t appointment-calendar:release-candidate .
      - run: echo 'Deployment/signing requires explicit registry, KMS and cluster configuration.'
